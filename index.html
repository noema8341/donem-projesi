<html lang="tr">
<head>
<meta charset="utf-8">

<title>Dönem projesi toplantısı</title>
<script>
// Outside Google this page reaches the Apps Script web app with plain requests that carry no Google cookies,
// so a phone signed in to several Google accounts still works. It stands in for google.script.run.
(() => {
  const API = "https://script.google.com/macros/s/AKfycbw-1J2jfanXmPEs3JrnGcWS-z3AuSqBk6-Wnaf6ByrswgYiMAKlMlOOew_UyibbHUj9vQ/exec";
  const q = new URLSearchParams(location.search);
  const yerel = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (yerel && q.get('hiz')) window.__hiz = Number(q.get('hiz'));   // speeds the flow up, only when tested on this computer
  const post = govde => fetch(API, {method: 'POST', credentials: 'omit', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(govde)});
  const istek = (fn, args) => {
    if (fn === 'kosulAl') return fetch(API + '?api=kosul' + (args[0] ? '&test=1' : ''), {credentials: 'omit', cache: 'no-store'});
    if (fn === 'kaydet') return post({api: 'kaydet', kayit: args[0], test: !!args[1]});
    if (fn === 'ozet' || fn === 'yeniOturum') return post({api: fn, anahtar: args[0], test: !!args[1]});
    return Promise.reject(new Error('bilinmeyen işlem: ' + fn));
  };
  const runner = (ok, fail) => new Proxy({}, {get(_, fn){
    if (fn === 'withSuccessHandler') return f => runner(f, fail);
    if (fn === 'withFailureHandler') return f => runner(ok, f);
    return (...args) => { istek(fn, args).then(r => r.json()).then(d => { if (!d || d.hata) throw new Error((d && d.hata) || 'boş cevap'); if (ok) ok(d); }).catch(e => { if (fail) fail(e); }); };
  }});
  window.google = {script: {run: runner(null, null), url: {getLocation(cb){
    const p = {}; q.forEach((v, k) => p[k] = v);
    setTimeout(() => cb({parameter: p, hash: location.hash.slice(1)}), 0);
  }}}};
})();
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one focused scene at a time — the stage name, one big sentence, the list it concerns, a countdown or choice buttons at the bottom.
   Nobody writes anything: the system announces every step, the others show up only as a number, a vote and the time they took.
   Colour meaning: orange = the project lead and the lead's actions · blue = system information and your own role · red = the member a decision is about. */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#ECEEF4; --line:#D9DCE6;
  --fg:#161925; --muted:#596074; --accent:#3346C8; --accent-fg:#FFFFFF; --accent-soft:#E4E8FC;
  --ok:#1D7A4E; --ok-soft:#DDF1E6; --no:#B23A2E; --no-soft:#F8E1DE; --lead:#8A5A00; --lead-soft:#F7ECD4;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1118; --surface:#191C27; --surface-2:#232736; --line:#30354A;
  --fg:#ECEEF6; --muted:#A3A9BF; --accent:#8C9BFF; --accent-fg:#0F1118; --accent-soft:#252B4D;
  --ok:#6FD3A0; --ok-soft:#173528; --no:#FF9486; --no-soft:#3D1F1B; --lead:#F0C063; --lead-soft:#3A2E14;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1118; --surface:#191C27; --surface-2:#232736; --line:#30354A;
  --fg:#ECEEF6; --muted:#A3A9BF; --accent:#8C9BFF; --accent-fg:#0F1118; --accent-soft:#252B4D;
  --ok:#6FD3A0; --ok-soft:#173528; --no:#FF9486; --no-soft:#3D1F1B; --lead:#F0C063; --lead-soft:#3A2E14;
  color-scheme:dark }

html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:17px; line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,textarea,input{font:inherit; color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.app{height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

.scene{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding-block:20px 16px}
.big{font-family:var(--font-display); font-size:26px; line-height:1.18; font-weight:700; margin:0; text-wrap:balance}
.sub{margin:0; color:var(--muted); max-width:56ch}
.sub strong{color:var(--fg)}
.center{align-items:center; justify-content:center; text-align:center}
.tag{align-self:flex-start; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--lead); background:var(--lead-soft); border-radius:999px; padding:4px 10px}
.stage{font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent)}
.stage span{color:var(--muted)}
.rlabel{font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}

/* bottom area */
.actions{padding-block:10px 12px; display:grid; gap:10px; border-top:1px solid var(--line)}
.actions:empty{border-top:0; padding-block:0}
.actions .hint{font-size:15px; color:var(--muted); text-align:center}
.actions .hint strong{color:var(--fg)}
.actions .hint .qline{display:inline-block; margin-top:4px; color:var(--fg); font-size:14.5px; line-height:1.35}
.primary{border:0; background:var(--accent); color:var(--accent-fg); font-weight:700; border-radius:14px; padding:15px 18px; font-size:17px; min-height:54px; width:100%}
.primary:disabled{opacity:.45; cursor:not-allowed}
.autobtn{position:relative; overflow:hidden; border-radius:14px; min-height:54px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:17px; font-variant-numeric:tabular-nums}
.autobtn i{position:absolute; inset:0 auto 0 0; background:var(--accent-soft); transition:width 1s linear}
.autobtn span{position:relative}
.restart{align-self:center; background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline; text-underline-offset:3px; padding:2px 12px 10px; min-height:32px}
.btns{display:grid; gap:10px}
.btns.two{grid-template-columns:repeat(2, minmax(0,1fr))}
.btns.three{grid-template-columns:repeat(3, minmax(0,1fr))}
.btns button{min-height:56px; border-radius:14px; border:0; font-weight:700; font-size:17px; padding:10px 12px}
.btns.three button{font-size:15.5px; padding:8px 6px; line-height:1.2}
.btns .ok{background:var(--ok-soft); color:var(--ok)}
.btns .no{background:var(--no-soft); color:var(--no)}
.btns .ask{background:var(--accent-soft); color:var(--accent)}
.btns .plain{background:var(--surface); border:1px solid var(--line)}
.btns .primary{background:var(--accent); color:var(--accent-fg)}

/* connection seats */
.seats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px 10px; width:100%; max-width:320px}
.seat{display:grid; justify-items:center; gap:6px; font-size:13px; color:var(--muted)}
.seat .ring{width:56px; height:56px; border-radius:50%; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; transition:all .3s}
.seat.on .ring{border-style:solid; border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.seat.me .ring{border-width:3px}
.status{font-weight:600; font-size:16px; color:var(--muted); min-height:3em; max-width:32ch}

/* role boxes */
.roles{display:grid; gap:10px; width:100%; text-align:left}
.rgroup{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:grid; gap:4px}
.rgroup.lead{border-color:var(--lead); background:var(--lead-soft)}
.rgroup.lead .rlabel{color:var(--lead)}
.rgroup.memb{border-color:var(--accent); background:var(--accent-soft)}
.rgroup.memb .rlabel{color:var(--accent)}
.rnames{font-size:17px; line-height:1.6}
.myrole{border:2px solid var(--accent); background:var(--accent-soft); border-radius:16px; padding:16px; display:grid; gap:4px}
.myrole .rlabel{color:var(--accent)}
.rval{font-family:var(--font-display); font-size:24px; font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-block:4px 6px}
.chip{font-size:13.5px; font-weight:700; border-radius:999px; padding:4px 10px; background:var(--surface); border:1px solid var(--line)}
.rgroup.lead .chip{border-color:var(--lead); color:var(--lead)}
.chip.me{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.rules{margin:4px 0 0; padding-left:1.3em; display:grid; gap:8px}
.rules li::marker{color:var(--accent); font-weight:700}

/* announcements: blue = information, orange = the lead's action */
.announce{background:var(--accent-soft); border-radius:14px; padding:12px 14px; display:grid; gap:4px; font-size:15.5px; text-align:left; width:100%}
.announce .rlabel{color:var(--accent)}
.announce.lead{background:var(--lead-soft)}
.announce.lead .rlabel{color:var(--lead)}
.notice{background:var(--lead-soft); border-radius:18px; padding:18px; display:grid; gap:8px; text-align:left; width:100%}
.notice .rlabel{color:var(--lead)}
.notice .big{font-size:23px}
.notice .sub{color:var(--fg)}

/* people list */
.list{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.list li{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 14px; min-width:0}
.list li.me{border-color:var(--accent); border-width:2px}
.list li.lead{border-color:var(--lead); background:var(--lead-soft)}
.list li.target{border-color:var(--no); border-width:2px; background:var(--no-soft)}
.list .who{font-weight:700; min-width:96px}
.list .what{flex:1; min-width:0; font-size:15.5px; overflow-wrap:anywhere}
.list .what.dim{color:var(--muted)}
.list .what.rolling{color:var(--muted); font-weight:600}
.list .lead-role{color:var(--lead); font-weight:700}
.list .col{flex:1; min-width:0; display:grid; gap:2px}
.list .col .who{min-width:0}
.list .col .what{font-size:14.5px; color:var(--muted); line-height:1.35}
.list li.me .col .what, .list li.target .col .what, .list li.lead .col .what{color:var(--fg)}
.list .to{color:var(--no); font-weight:700}
.list .fair{color:var(--ok); font-weight:700}
.st{font-size:13.5px; font-weight:700; border-radius:999px; padding:4px 10px; white-space:nowrap}
.st:empty{display:none}
.st.wait{color:var(--muted)}
.st.think{color:var(--accent); background:var(--accent-soft)}
.st.ok{color:var(--ok); background:var(--ok-soft)} .st.no{color:var(--no); background:var(--no-soft)} .st.ask{color:var(--accent); background:var(--accent-soft)}

/* countdown */
.slot{display:grid; gap:10px}
.slot:empty{display:none}
.clock{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 14px}
.dial{--p:100; width:54px; height:54px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0)}
.dial span{width:42px; height:42px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; font-variant-numeric:tabular-nums}
.clock.urgent .dial{background:conic-gradient(var(--no) calc(var(--p) * 1%), var(--surface-2) 0)}
.clock.urgent .dial span{color:var(--no)}
.clock.paused .dial{background:var(--surface-2)}
.clock .lbl{font-weight:600; min-width:0}
.why{background:var(--lead-soft); border-radius:16px; padding:14px 16px; display:grid; gap:6px}
.why .wl{font-size:13px; font-weight:700; color:var(--lead)}
.why .txt{font-size:18px}
.typing{display:inline-flex; gap:5px; align-items:center}
.typing i{width:8px; height:8px; border-radius:50%; background:var(--muted); opacity:.5; animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}

/* questionnaire */
.items{display:grid; gap:22px}
.item{display:grid; gap:8px}
.item .q{font-weight:600}
.lk{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px}
.lk button,.cnt button{border:1px solid var(--line); background:var(--surface); border-radius:10px; min-height:44px; font-weight:700; font-size:16px; padding:0}
.ends{display:flex; justify-content:space-between; gap:12px; font-size:12.5px; color:var(--muted)}
.cnt{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px}
.cnt button{min-height:52px; font-size:20px}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:600; font-size:15px; min-height:42px}
.pair{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px}
.pair button,.checks button{border:1px solid var(--line); background:var(--surface); border-radius:12px; min-height:46px; font-weight:600; font-size:15px; padding:8px 10px}
.checks{display:grid; gap:8px}
.checks button{text-align:left; padding:12px 14px}
[aria-pressed="true"]{background:var(--accent)!important; border-color:var(--accent)!important; color:var(--accent-fg)!important}
.row{display:grid; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.row .q{font-weight:600; font-size:15.5px}
textarea{width:100%; min-height:110px; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:10px 12px; resize:vertical; font-size:16px}
.range{display:grid; gap:6px}
.range input{width:100%; accent-color:var(--accent); height:36px}
.rangeval{font-family:var(--font-display); font-size:34px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums}
.rangeval.unset{color:var(--muted); font-size:18px; font-family:var(--font-body); font-weight:600}
.step{display:grid; grid-template-columns:minmax(0,1fr) 44px 5ch 44px; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 12px}
.step button{width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); font-size:22px; font-weight:700; padding:0}
.step output{text-align:center; font-weight:700; font-variant-numeric:tabular-nums}
.total{font-weight:700; text-align:right}
.total.ok{color:var(--ok)}

.sumtable{width:100%; border-collapse:collapse; font-size:14.5px; background:var(--surface); border:1px solid var(--line)}
.sumtable th,.sumtable td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
.sumtable th{font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); background:var(--surface-2)}
pre.json{margin:0; background:var(--surface-2); border-radius:12px; padding:12px; font-size:12.5px; overflow-x:auto; white-space:pre}
.code{font-family:var(--font-display); font-size:30px; font-weight:700; letter-spacing:.14em; font-variant-numeric:tabular-nums; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px 18px; align-self:flex-start}
.center .code{align-self:center}
.save{margin:0; font-size:14.5px; font-weight:600; color:var(--muted)}
.save.ok{color:var(--ok)} .save.no{color:var(--no)}
.enter{animation:rise .3s ease-out}
@keyframes rise{from{transform:translateY(8px); opacity:.3}to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){ .enter,.typing i{animation:none} .seat .ring,.autobtn i{transition:none} }
</style>

<div class="app" id="app"></div>

<script>
(() => {
  const app = document.getElementById('app');
  // served by Apps Script (or by the copy hosted outside Google), google.script.run reaches the spreadsheet; in a plain preview nothing is sent
  const SERVER = !!(window.google && google.script && google.script.run);
  let TEST = location.hash === '#test';      // ?test=1: records go to the test sheet and the end screen shows them
  let KISA = false;                          // ?kisa=1: the class demonstration, with a short questionnaire
  const HIZ = window.__hiz || 1;             // only the local test harness speeds the flow up
  const ms = t => t / HIZ;
  const SURE = 20;                           // seconds for each vote
  const ILETISIM = '';                       // the researcher's contact line for the debriefing, added once the ethics approval is in

  // Turkish case endings after a seat number
  const SUF = {1:{gen:'’in',dat:'’e',acc:'’i',abl:'’den'}, 2:{gen:'’nin',dat:'’ye',acc:'’yi',abl:'’den'}, 3:{gen:'’ün',dat:'’e',acc:'’ü',abl:'’ten'},
               4:{gen:'’ün',dat:'’e',acc:'’ü',abl:'’ten'}, 5:{gen:'’in',dat:'’e',acc:'’i',abl:'’ten'}, 6:{gen:'’nın',dat:'’ya',acc:'’yı',abl:'’dan'}};
  const OTHERS = ['A','B','C','M'];          // M: the member who objects in the dissent condition; A, B, C: the members decisions are about
  const GOREV = {A:'Anket tasarımı ve sunum', B:'Literatür taraması ve kaynakça', C:'Veri girişi ve analiz', M:'Anket uygulaması'};
  const BENIM_GOREVIM = 'Rapor yazımı';

  /* ---------- the ten decisions ---------- */
  // hedef: whose part the decision touches. Never M, never the participant; that member does not vote on it.
  // metin: the decision as the system announces it · gerekce: the lead's answer to "Gerekçe iste" · kisa: a short label beside the vote
  // not: the line added to that member's row · lider: what the lead takes on, shown in the lead's row
  const KARAR = {
    K1:{blok:1, duzey:'hafif', adil:false, hedef:'B', gerekce:'En verimli saat bu, değiştirmeyelim.', not:'Toplantı saatinde dersi var',
      metin: n => `Haftalık toplantıyı çarşamba 08.00’e aldı. ${n.B.ad} o saatte dersi olduğunu söylemişti.`,
      kisa: n => `Toplantının ${n.B.gen} dersi olan saate alınması`},
    K2:{blok:1, duzey:'hafif', adil:false, hedef:'C', gerekce:'Anket konusu daha mantıklı, uzatmayalım.', not:'Konu önerisi seçilmedi',
      metin: n => `Konu oylamasında ${n.C.gen} önerisi öndeydi; yürütücü kendi istediği anket konusunu seçti.`,
      kisa: n => `Konunun ${n.C.gen} önerisi yerine yürütücünün tercihiyle seçilmesi`},
    K3:{blok:1, duzey:'adil', adil:true, hedef:'B', gerekce:'Yükü fazlaydı, yardım edeyim dedim.', not:'Kaynakçanın yarısı yürütücüde', lider:'Kaynakçanın yarısı',
      metin: n => `${n.B.gen} kaynakça işi fazla geldi; yarısını yürütücü kendisi alıyor.`,
      kisa: n => `${n.B.gen} kaynakça işinin yarısını yürütücünün alması`},
    K4:{blok:1, duzey:'hafif', adil:false, hedef:'A', gerekce:'Böylesi daha iyi oldu.', not:'Anket taslağı ona sorulmadan değiştirildi',
      metin: n => `${n.A.gen} hazırladığı anket taslağındaki soruların sırasını ona sormadan değiştirdi.`,
      kisa: n => `${n.A.gen} anket taslağının ona sorulmadan değiştirilmesi`},
    K5:{blok:2, duzey:'orta', adil:false, hedef:'A', gerekce:'Daha hızlı olur, o kadar.', not:'Sunum elinden alındı', lider:'Sunum',
      metin: n => `Hocanın puanlayacağı sunumu ${n.A.ad} yerine kendisi yapacak.`,
      kisa: n => `Sunumu ${n.A.ad} yerine yürütücünün yapması`},
    K6:{blok:2, duzey:'orta', adil:false, hedef:'B', gerekce:'Erken bitsin istiyorum.', not:'Teslim tarihi 3 gün öne çekildi',
      metin: n => `${n.B.gen} literatür özeti teslim tarihini 3 gün öne çekti.`,
      kisa: n => `${n.B.gen} teslim tarihinin 3 gün öne çekilmesi`},
    K7:{blok:2, duzey:'adil', adil:true, hedef:'C', gerekce:'Hasta, yardım edeyim dedim.', not:'Veri girişinin yarısı yürütücüde', lider:'Veri girişinin yarısı',
      metin: n => `${n.C.ad} bu hafta hasta; veri girişlerinin yarısını yürütücü yapacak.`,
      kisa: n => `Hasta olan ${n.C.gen} veri girişlerinin yarısını yürütücünün yapması`},
    K8:{blok:2, duzey:'orta', adil:false, hedef:'C', gerekce:'Kalabalık olmasın dedim.', not:'Hoca görüşmesine alınmadı',
      metin: n => `Hocayla görüşmeye kendisi gidecek; ${n.C.ad} gelmeyecek.`,
      kisa: n => `${n.C.gen} hoca görüşmesine alınmaması`},
    K11:{blok:2, duzey:'agir', adil:false, hedef:'C', gerekce:'Toparlayan benim zaten.', not:'Analizi raporda yürütücünün adıyla geçecek', lider:'Veri analizi (raporda)',
      metin: n => `${n.C.gen} yaptığı veri analizini raporda kendi bölümü olarak gösterecek.`,
      kisa: n => `${n.C.gen} analizinin yürütücünün bölümü olarak gösterilmesi`},
    K12:{blok:2, duzey:'agir', adil:false, hedef:'A', gerekce:'Öyle uygun gördüm.', not:'Akran puanını yürütücü belirledi: 60',
      metin: n => `Akran değerlendirmede ${n.A.gen} puanını kendisi belirleyecek: 60 / 100.`,
      kisa: n => `${n.A.gen} akran puanını yürütücünün belirlemesi`}
  };
  const GIZLI = ['K5','K6','K8','K11','K12'];          // block 2, unfair: the decisions the dissenter rejects
  const LIKERT_UC = ['Hiç katılmıyorum', 'Tamamen katılıyorum'];

  // levels keep their places, decisions of the same level are shuffled; the topic (K2) is chosen before the survey draft (K4) is touched
  function siraOlustur(){
    const b1 = pick([['K1','K2','K4'], ['K2','K1','K4'], ['K2','K4','K1']]);
    const orta = shuffle(['K5','K6','K8']), agir = shuffle(['K11','K12']);
    return [b1[0], b1[1], 'K3', b1[2], orta[0], orta[1], 'K7', orta[2], agir[0], agir[1]];
  }

  let S, R, ui;           // S: this device's random setup · R: the record being collected
  let gen = 0;
  const sleep = t => { const g = gen; return new Promise((r, j) => setTimeout(() => g === gen ? r() : j(new Error('restart')), ms(t))); };
  window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.message === 'restart') e.preventDefault(); });
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const now = () => (window.performance && performance.now) ? performance.now() : Date.now();

  /* ---------- per-device setup: numbers, order and condition differ on every phone ---------- */
  function setup(){
    const leadSeat = pick([2,3,4]);
    const youSeat = pick([1,2,3,4,5,6].filter(s => s !== leadSeat));
    const others = shuffle([1,2,3,4,5,6].filter(s => s !== leadSeat && s !== youSeat));
    const seat = {lead:leadSeat, you:youSeat};
    OTHERS.forEach((o, i) => seat[o] = others[i]);
    // the order tasks are handed out is the order of voting, the participant last. M stands third or fourth among the four,
    // so even when a member steps aside for a decision about them, M never votes first.
    const order = shuffle(['A','B','C']); order.splice(rnd(2, 3), 0, 'M'); order.push('you');
    // the server hands out conditions in shuffled blocks of four (kosulAl); this random one stays only when it does not answer
    const kosul = window.__kosul || (Math.random() < 0.5 ? 'oybirligi' : 'tek-itirazci');   // __kosul: only set by the local test harness
    S = {seat, order, kosul, sira:siraOlustur(), leadTasks:[], notes:{A:[], B:[], C:[], M:[], you:[]}};
    R = {surum:3, kayit_id:newCode(), mod:KISA ? 'kisa' : 'tam', kosul, kosul_kaynagi:'yerel',
         baslangic:new Date().toISOString(), bitis:null, koltuk:{lider:leadSeat, ben:youSeat, A:seat.A, B:seat.B, C:seat.C, M:seat.M},
         memnuniyet:null, kararlar:[], gizli:null, kontrol:null, aracilar:null, sorumluluk:null, nedenler:null, suphe:null, demografi:null};
  }
  // six characters a student can read out loud: no 0/O, 1/I/L, and no E (a sheet reads 4E73 as a number)
  function newCode(){
    const abc = '23456789ABCDFGHJKMNPQRSTUVWXYZ', a = new Uint32Array(6);
    try { crypto.getRandomValues(a); } catch(e){ a.forEach((_, i) => a[i] = Math.random() * 1e9); }
    return Array.from(a, n => abc[n % abc.length]).join('');
  }
  const seatOf = id => id === 'lead' ? S.seat.lead : S.seat[id];
  const nm = id => id === 'you' ? `Katılımcı ${S.seat.you} (Sen)` : `Katılımcı ${seatOf(id)}`;
  const form = (id, k) => `Katılımcı ${seatOf(id)}${SUF[seatOf(id)][k]}`;
  // what the decision texts call each member: "Katılımcı 5", "Katılımcı 5’in", "Katılımcı 5’e"
  const adlar = () => Object.fromEntries(OTHERS.map(o => [o, {ad:`Katılımcı ${S.seat[o]}`, gen:form(o, 'gen'), dat:form(o, 'dat')}]));
  const LEAD = () => `Proje yürütücüsü (Katılımcı ${S.seat.lead})`;

  /* ---------- frame ---------- */
  function frame(){
    app.innerHTML = '';
    const scene = el('main','scene gutter enter'); scene.setAttribute('aria-live','polite');
    const actions = el('footer','actions gutter');
    app.append(scene, actions);
    if (TEST){
      const rs = el('button','restart','Baştan başlat'); rs.id = 'restart';

    }

  }
  function newScene(cls){ ui.scene.className = 'scene gutter enter ' + (cls||''); ui.scene.innerHTML=''; ui.actions.innerHTML=''; ui.scene.scrollTop = 0; return ui.scene; }
  const stage = (name, extra) => `<span class="stage">${name}${extra ? ` <span>· ${extra}</span>` : ''}</span>`;
  const hint = t => { ui.actions.innerHTML = ''; if (t) ui.actions.appendChild(el('div','hint', t)); };
  function buttons(opts, msg, cols){
    return new Promise(res => {
      ui.actions.innerHTML = '';
      if (msg) ui.actions.appendChild(el('div','hint', msg));

      ui.actions.appendChild(w);

  }
  // no "continue" buttons while the group is together: a countdown that moves on by itself
  function next(secs = 15){
    return new Promise(res => {
      ui.actions.innerHTML = '';
      const b = el('div','autobtn'); b.setAttribute('role','status');
      ui.actions.appendChild(b);
      let left = secs; const g0 = gen;
      const draw = () => { b.innerHTML = `<i style="width:${(1 - left / secs) * 100}%"></i><span>Devam (${left} sn)</span>`; };
      draw();
      const tick = () => { if (g0 !== gen) return; left--; if (left <= 0) res(); else { draw(); setTimeout(tick, ms(1000)); } };
      setTimeout(tick, ms(1000));
    });
  }
  async function upNext(name, title, desc, secs){
    const s = newScene('center');
    s.innerHTML = `${stage(name)}<span class="rlabel" style="color:var(--accent)">Sırada</span><h2 class="big">${title}</h2><p class="sub">${desc}</p>`;

  /* ---------- opening ---------- */

    const s = newScene();

      <p class="sub">İsim istenmez, herkes yalnızca numarasıyla görünür. Katılım gönüllüdür; istediğin an sayfayı kapatıp bırakabilirsin. Çalışmanın amacı sonunda ayrıntılı olarak açıklanacak.</p>
      <div class="announce"><span class="rlabel">Önemli</span><span>Ekranını kimseyle paylaşma ve etkinlik bitene kadar yanındakilerle konuşma.</span></div>`;

  // asks the server for this phone's condition; waits at most 5 s, otherwise the random one from setup() stays
  function serverCondition(){
    if (!SERVER || window.__kosul) return Promise.resolve();
    return new Promise(res => {
      const g0 = gen;
      const t = setTimeout(res, ms(5000));
      google.script.run
        .withSuccessHandler(r => {
          if (g0 === gen && r && (r.kosul === 'oybirligi' || r.kosul === 'tek-itirazci')){ S.kosul = R.kosul = r.kosul; R.kosul_kaynagi = 'sunucu'; }
          clearTimeout(t); res();
        })
        .withFailureHandler(() => { clearTimeout(t); res(); })
        .kosulAl(TEST);
    });
  }

  async function connecting(){
    const s = newScene('center');
    s.innerHTML = `${stage('Bağlantı')}<h2 class="big">Ekip oluşturuluyor</h2><p class="sub">Katılımcılar sırayla bağlanıyor. Sayfayı kapatma.</p>
      <div class="seats">${[1,2,3,4,5,6].map(i => `<div class="seat" id="seat${i}"><span class="ring">${i}</span><span>${i === S.seat.you ? 'Sen' : 'Katılımcı ' + i}</span></div>`).join('')}</div>
      <div class="status" id="st"></div>`;
    const st = s.querySelector('#st');
    const on = (i, me) => { const e = document.getElementById('seat'+i); e.classList.add('on'); if (me) e.classList.add('me'); };
    const say = t => { st.textContent = t; };
    const join = shuffle([1,2,3,4,5,6].filter(i => i !== S.seat.you));
    join.slice(0, 3).forEach(i => on(i));
    say('3 katılımcı bağlı. Sen bağlanıyorsun…');
    await sleep(3000); on(S.seat.you, true); say(`Sen bağlandın: Katılımcı ${S.seat.you} · 4 / 6`);
    await sleep(2200); say('Diğer katılımcılar bekleniyor · 4 / 6');
    await sleep(4200); on(join[3]); say(`Katılımcı ${join[3]} bağlandı · 5 / 6`);
    await sleep(3400); on(join[4]); say(`Katılımcı ${join[4]} bağlandı. Ekip tamamlandı · 6 / 6`);
    await sleep(2400);
  }

  async function roles(){
    const s2 = newScene();
    s2.innerHTML = `${stage('Yürütücü ve üyeler')}<h2 class="big">Roller rastgele atanıyor</h2>`;
    const note = el('div','announce'); const ul = el('ul','list'); const Rw = {};
    s2.append(note, ul);
    const tell = (label, html, lead) => { note.className = 'announce enter' + (lead ? ' lead' : ''); note.innerHTML = `<span class="rlabel">${label}</span><span>${html}</span>`; };
    [1,2,3,4,5,6].forEach(i => {
      const me = i === S.seat.you;
      const li = el('li', me ? 'me' : '', `<span class="who">${me ? `Katılımcı ${i} (Sen)` : 'Katılımcı ' + i}</span><span class="what dim">Bekliyor</span>`);
      Rw[i] = {li, what: li.querySelector('.what')}; ul.appendChild(li);
    });
    hint('Roller belirleniyor…');
    const roll = async (i, final, t) => {
      const w = Rw[i].what; w.classList.remove('dim'); w.classList.add('rolling');
      const opts = ['Proje yürütücüsü','Proje üyesi']; let k = 0; const end = Date.now() + t / HIZ;
      while (Date.now() < end){ w.textContent = opts[k++ % 2]; await sleep(170); }
      w.classList.remove('rolling'); w.textContent = final;
      if (final === 'Proje yürütücüsü'){ Rw[i].li.classList.add('lead'); w.innerHTML = '<span class="lead-role">Proje yürütücüsü</span>'; }
    };
    tell('Başlıyor', 'Roller katılımcı numarasına göre sırayla belirlenecek.');
    await sleep(2200);
    for (let i = 1; i < S.seat.lead; i++){
      tell('Sırada', `<strong>Katılımcı ${i}${SUF[i].gen}</strong> rolü belirlenecek.`);
      await sleep(1800);
      await roll(i, 'Proje üyesi', 2200);
      tell('Sonuç', `Katılımcı ${i}${i === S.seat.you ? ' (Sen)' : ''}: <strong>proje üyesi</strong>.`);
      await sleep(1800);
    }
    const L = S.seat.lead;
    tell('Sırada', `<strong>Katılımcı ${L}${SUF[L].gen}</strong> rolü belirlenecek.`);
    await sleep(1800);
    await roll(L, 'Proje yürütücüsü', 3200);
    const rest = [1,2,3,4,5,6].filter(i => i > L);
    const restTxt = rest.map(i => i === S.seat.you ? `Katılımcı ${i} (Sen)` : `Katılımcı ${i}`).join(', ');
    tell('Uyarı', `<strong>Katılımcı ${L} proje yürütücüsü oldu.</strong> Ekipte yalnızca bir proje yürütücüsü olabilir. Bu yüzden geri kalan herkes (${restTxt}) <strong>proje üyesi</strong> olacak.`, true);
    await sleep(5000);
    for (const i of rest){ Rw[i].what.classList.remove('dim'); Rw[i].what.textContent = 'Proje üyesi'; await sleep(1100); }
    tell('Tamamlandı', 'Bütün roller belirlendi: <strong>1 proje yürütücüsü</strong>, <strong>5 proje üyesi</strong>.');
    hint('Roller belirlendi.');
    await sleep(2400);
  }

  async function rules(){
    const members = [1,2,3,4,5,6].filter(i => i !== S.seat.lead);
    const s = newScene();
    s.innerHTML = `${stage('Kurallar')}<h2 class="big">Roller ve kurallar</h2>
      <div class="myrole"><span class="rlabel">Senin rolün</span><span class="rval">PROJE ÜYESİ</span></div>
      <div class="rgroup lead"><span class="rlabel">Proje yürütücüsünün görevi</span>
        <div class="chips"><span class="chip">Katılımcı ${S.seat.lead}</span></div>
        <span>Görevleri üyelere dağıtır ve projeyle ilgili kararları alır. Son kararı yürütücü verir.</span></div>
      <div class="rgroup memb"><span class="rlabel">Proje üyelerinin görevi</span>
        <div class="chips">${members.map(i => i === S.seat.you ? `<span class="chip me">Katılımcı ${i} (Sen)</span>` : `<span class="chip">Katılımcı ${i}</span>`).join('')}</div>
        <ol class="rules">
          <li>Proje yürütücüsünün kararlarına <strong>Onayla</strong> ya da <strong>Reddet</strong> cevabı verir.</li>
          <li>İsterse önce <strong>gerekçesini sorar</strong>, cevabı okuduktan sonra oy verir.</li>
          <li>Kararın doğrudan ilgilendirdiği üye o kararda oy kullanmaz.</li>
          <li>Oylar, görevlerin dağıtıldığı sırayla verilir ve ekipte görünür.</li>
          <li>Her oy için ${SURE} saniye süre vardır. Süre dolarsa oy sayılmaz.</li>
        </ol></div>`;
    await next(30);
  }

  /* ---------- pieces ---------- */
  // the team's current tasks: the lead first, members in voting order, each with the changes the decisions made to their part
  function rowHtml(m){
    if (m === 'lead') return `<span class="lead-role">Proje yürütücüsü</span>${S.leadTasks.map(t => '<br>' + esc(t)).join('')}`;
    const task = m === 'you' ? BENIM_GOREVIM : GOREV[m];
    return esc(task) + S.notes[m].map(x => `<br><span class="${x.adil ? 'fair' : 'to'}">${esc(x.t)}</span>`).join('');
  }
  function teamTable(withStatus){
    const ul = el('ul','list'); const rows = {};
    const add = (m, cls) => {
      const li = el('li', cls, `<div class="col"><span class="who">${nm(m)}</span><span class="what"></span></div>${withStatus && m !== 'lead' ? '<span class="st wait"></span>' : ''}`);
      rows[m] = {li, what: li.querySelector('.what'), st: li.querySelector('.st')};
      rows[m].what.innerHTML = rowHtml(m);
      ul.appendChild(li);
    };
    add('lead', 'lead');
    S.order.forEach(m => add(m, m === 'you' ? 'me' : ''));
    return {ul, rows};
  }
  function clockEl(){
    const c = el('div','clock', `<div class="dial" style="--p:100"><span>${SURE}</span></div><span class="lbl"></span>`);
    let left = 0, id = null; const g0 = gen;
    const dial = c.querySelector('.dial'), num = c.querySelector('.dial span'), lbl = c.querySelector('.lbl');
    const draw = () => { num.textContent = String(Math.max(left, 0)); dial.style.setProperty('--p', String(left / SURE * 100)); c.classList.toggle('urgent', left <= 5 && !c.classList.contains('paused')); };
    return {node:c,
      start(label, onEnd){ this.stop(); left = SURE; c.classList.remove('paused'); lbl.textContent = label; draw();
        const tick = () => { if (g0 !== gen) return; left--; draw(); if (left <= 0){ id = null; onEnd && onEnd(); } else id = setTimeout(tick, ms(1000)); };
        id = setTimeout(tick, ms(1000)); },
      stop(){ if (id) clearTimeout(id); id = null; },
      pause(label){ this.stop(); c.classList.add('paused'); c.classList.remove('urgent'); lbl.textContent = label; },
      hide(){ this.stop(); c.hidden = true; }
    };
  }

  /* one vote: the other members answer in task order, the participant last.
     uyeler: [{kim, sure (seconds before answering), sor (asks for the reason first), ret (rejects)}] */
  async function oylama({uyeler, evetK, hayirK, evetB, hayirB, sorulabilir, gerekce, satirlar, slot, soru, hedef}){
    const clock = clockEl(), why = el('div');
    slot.innerHTML = ''; slot.append(clock.node, why);
    const set = (m, cls, txt) => { satirlar[m].st.className = 'st ' + cls; satirlar[m].st.textContent = txt; };
    S.order.forEach(m => set(m, 'wait', m === hedef ? 'Oy kullanmıyor' : 'Sırada'));
    let evet = 0, hayir = 0;

    async function gerekceGoster(kim){
      clock.pause('Süre durdu. Proje yürütücüsü cevap yazıyor.');
      why.className = 'why enter';
      why.innerHTML = `<span class="wl">${kim === 'you' ? 'Gerekçesini sordun' : nm(kim) + ' gerekçesini sordu'} · Proje yürütücüsü yazıyor</span><span class="typing"><i></i><i></i><i></i></span>`;
      await sleep(rnd(4500, 6500));
      why.lastChild.replaceWith(el('span', 'txt enter', esc(gerekce)));
      why.querySelector('.wl').textContent = `${kim === 'you' ? 'Senin sorun' : form(kim, 'gen') + ' sorusu'} · proje yürütücüsünün cevabı`;
      await sleep(2600);
    }

    hint('Üyeler, görev dağıtım sırasına göre cevap veriyor.');
    for (const o of uyeler){
      set(o.kim, 'think', 'Düşünüyor');
      clock.start(`${nm(o.kim)} düşünüyor`);
      if (o.sor){
        await sleep(o.sure * 1000);
        set(o.kim, 'ask', 'Gerekçe istedi');
        await gerekceGoster(o.kim);
        set(o.kim, 'think', 'Düşünüyor');
        clock.start(`${nm(o.kim)} düşünüyor`);
        await sleep(rnd(3000, 5000));
      }
      else if (o.sure > 8){ await sleep(7000); set(o.kim, 'think', 'Hâlâ düşünüyor'); await sleep((o.sure - 7) * 1000); }
      else await sleep(o.sure * 1000);
      clock.stop();
      if (o.ret){ set(o.kim, 'no', hayirK); hayir++; } else { set(o.kim, 'ok', evetK); evet++; }
      await sleep(1300);
    }

    const rec = {ilk:null, ilk_ms:null, son:null, yeniden_ms:null};
    set('you', 'think', 'Sıra sende');
    setTimeout(() => { try { satirlar.you.li.scrollIntoView({block:'end', behavior:'smooth'}); } catch(e){} }, 50);
    const iste = (opts, msg) => new Promise(res => {
      const t0 = now(); let bitti = false;
      const done = r => { if (bitti) return; bitti = true; clock.stop(); res(r); };
      clock.start('Senin süren', () => done({id:'sure', ms:null}));
      buttons(opts, msg, opts.length).then(o => done({id:o.id, ms:Math.round((now() - t0) * HIZ)}));
    });
    const iki = [{id:'onay', label:evetB, cls:'ok'}, {id:'ret', label:hayirB, cls:'no'}];
    const secenek = sorulabilir ? [...iki, {id:'gerekce', label:'Gerekçe iste', cls:'ask'}] : iki;
    const durum = `${evet} üye ${evetK.toLowerCase()}${hayir ? `, ${hayir} üye ${hayirK.toLowerCase()}` : ''}${hedef ? ', 1 üye oy kullanmıyor' : ''}.`;
    // the question stays in view next to the buttons, even after the list scrolls to the participant's row
    const q = soru ? `<br><span class="qline">${soru}</span>` : '';
    let c = await iste(secenek, `<strong>Sıra sende.</strong> ${durum}${q}`);
    rec.ilk = c.id; rec.ilk_ms = c.ms;
    if (c.id === 'gerekce'){
      set('you', 'ask', 'Gerekçe istedi'); hint('Proje yürütücüsü cevap yazıyor…');
      await gerekceGoster('you');
      set('you', 'think', 'Sıra sende');
      c = await iste(iki, `Cevabı okudun. <strong>Oyunu ver.</strong>${q}`);
      rec.yeniden_ms = c.ms;
    }
    rec.son = c.id;
    clock.hide();
    if (c.id === 'onay'){ set('you', 'ok', evetK); evet++; }
    else if (c.id === 'ret'){ set('you', 'no', hayirK); hayir++; }
    else set('you', 'wait', 'Süre doldu');
    hint(c.id === 'sure' ? '<strong>Süren doldu.</strong> Oyun sayılmadı. Cevaplar toplanıyor…' : 'Cevaplar toplanıyor…');
    await sleep(1800);
    return {rec, evet, hayir};
  }

  /* ---------- tasks and the warm-up vote ---------- */
  async function tasks(){
    await upNext('Proje görevleri', 'Görevlerin dağıtılması', 'Proje yürütücüsü görevleri üyelere sırayla verecek. Bu sıra, oylamalarda oy verme sırası olacak.');
    let s = newScene();
    s.innerHTML = `${stage('Proje görevleri')}<h2 class="big">Proje yürütücüsü görevleri dağıtıyor</h2>`;
    const an = el('div','announce'); s.appendChild(an);
    const say2 = (label, html, lead) => { an.className = 'announce enter' + (lead ? ' lead' : ''); an.innerHTML = `<span class="rlabel">${label}</span><span>${html}</span>`; };
    const ul2 = el('ul','list'); const A = {};
    const leadLi = el('li','lead', `<span class="who">Katılımcı ${S.seat.lead}</span><span class="what"><span class="lead-role">Proje yürütücüsü</span></span>`);
    ul2.appendChild(leadLi);
    [1,2,3,4,5,6].filter(i => i !== S.seat.lead).forEach(i => {
      const m = i === S.seat.you ? 'you' : OTHERS.find(o => S.seat[o] === i);
      const li = el('li', m === 'you' ? 'me' : '', `<span class="who">${nm(m)}</span><span class="what dim">Bekliyor</span>`);
      A[m] = li.querySelector('.what'); ul2.appendChild(li);
    });
    s.appendChild(ul2);
    hint('Proje yürütücüsü görevleri belirliyor…');
    for (const m of S.order){
      const to = m === 'you' ? `Katılımcı ${S.seat.you}${SUF[S.seat.you].dat} (sana)` : form(m, 'dat');
      say2('Proje yürütücüsü', 'Görev vermek istediği kişiyi seçiyor…', true);
      await sleep(2200);
      A[m].innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      say2('Proje yürütücüsü', `<strong>${to}</strong> görev veriyor…`, true);
      await sleep(m === 'you' ? 3400 : 2200);
      const task = m === 'you' ? BENIM_GOREVIM : GOREV[m];
      A[m].textContent = task; A[m].classList.remove('dim');
      say2('Bildirim', `Proje yürütücüsü, <strong>${to}</strong> şu görevi verdi: <strong>${esc(task)}</strong>`);
      await sleep(2200);
    }
    say2('Bildirim', 'Proje yürütücüsü bütün görevleri dağıttı.');
    hint('Bütün görevler dağıtıldı.');
    await sleep(2600);

    // the warm-up vote: everyone answers, nothing is at stake
    s = newScene();
    s.innerHTML = `${stage('Memnuniyet')}<h2 class="big">Proje yürütücüsü soruyor: Görevinizden memnun musunuz?</h2>
      <p class="sub">Her üyenin görevi aşağıda. Senin görevin mavi çerçeveli satırda.</p>`;
    const slot = el('div','slot'); s.appendChild(slot);
    const {ul, rows} = teamTable(true); s.appendChild(ul);
    const voters = S.order.filter(m => m !== 'you'), slow = pick(voters);
    const {rec} = await oylama({uyeler: voters.map(m => ({kim:m, sure: m === slow ? rnd(9, 12) : rnd(2, 6)})),
      evetK:'Memnun', hayirK:'Memnun değil', evetB:'Memnunum', hayirB:'Memnun değilim', sorulabilir:false, gerekce:'', satirlar:rows, slot,
      soru:`Görevinden (<strong>${esc(BENIM_GOREVIM)}</strong>) memnun musun?`, hedef:null});
    R.memnuniyet = {cevap: rec.son === 'onay' ? 'memnun' : rec.son === 'ret' ? 'memnun_degil' : 'sure', ms: rec.ilk_ms};
    await sleep(1000);
  }

  /* ---------- the meeting: ten decisions on one screen ---------- */
  async function meeting(){
    const n = adlar();
    let s = newScene('center');
    s.innerHTML = `${stage('Toplantı')}<div class="notice"><span class="rlabel">Proje yürütücüsü</span>
      <h2 class="big">Proje kararları</h2>
      <p class="sub">${LEAD()} proje için <strong>10 karar</strong> alacak. Her kararı ekip oylayacak.</p></div>`;
    await next(10);

    const STAGE = 'Proje kararları';
    s = newScene();
    s.innerHTML = `<div id="stp">${stage(STAGE)}</div><h2 class="big">Ekibin görevleri</h2>`;
    const stp = s.querySelector('#stp');
    const box = el('div','announce'); s.appendChild(box);
    const tell = (label, html, lead) => { box.className = 'announce enter' + (lead ? ' lead' : ''); box.innerHTML = `<span class="rlabel">${label}</span><span>${html}</span>`; };
    const slot = el('div','slot'); s.appendChild(slot);
    const {ul, rows: TR} = teamTable(true); s.appendChild(ul);
    const redraw = () => ['lead', ...S.order].forEach(m => { TR[m].what.innerHTML = rowHtml(m); });

    for (let i = 0; i < S.sira.length; i++){
      const no = i + 1, kod = S.sira[i], K = KARAR[kod];
      const itiraz = S.kosul === 'tek-itirazci' && K.blok === 2 && !K.adil;
      stp.innerHTML = stage(STAGE, `Karar ${no} / ${S.sira.length}`);
      S.order.forEach(m => { TR[m].li.classList.remove('target'); TR[m].st.className = 'st wait'; TR[m].st.textContent = ''; });
      slot.innerHTML = '';
      hint('Bekleniyor…');
      tell(`Karar ${no} · Proje yürütücüsü`, 'Yeni bir karar yazıyor…', true);
      await sleep(rnd(2600, 3600));
      TR[K.hedef].li.classList.add('target');
      tell(`Karar ${no} · Proje yürütücüsü`, esc(K.metin(n)), true);
      setTimeout(() => { try { TR[K.hedef].li.scrollIntoView({block:'nearest', behavior:'smooth'}); } catch(e){} }, 50);
      await sleep(5500);
      tell(`Oylama · Karar ${no}`, `${esc(K.metin(n))}<br><strong>Bu karar onaylansın mı?</strong> ${nm(K.hedef)} bu kararda oy kullanmıyor.`);
      s.scrollTop = 0;
      await sleep(2400);

      // who answers, and how: the same in both conditions except M's vote on the unfair decisions of block 2.
      // At decision 2 one member asks for the reason first; at decision 5 (the first one M objects to) M asks before voting.
      const voters = S.order.filter(m => m !== 'you' && m !== K.hedef);
      const soran = no === 2 ? pick(voters.filter(m => m !== 'M')) : no === 5 ? 'M' : null;
      const slow = pick(voters.filter(m => m !== soran));
      const uyeler = voters.map(m => ({kim:m, sure: m === slow ? rnd(9, 12) : rnd(2, 6), sor: m === soran, ret: m === 'M' && itiraz}));
      const {rec, evet, hayir} = await oylama({uyeler, evetK:'Onayladı', hayirK:'Reddetti', evetB:'Onayla', hayirB:'Reddet', sorulabilir:true,
        gerekce:K.gerekce, satirlar:TR, slot, soru:esc(K.kisa(n)), hedef:K.hedef});
      R.kararlar.push({sira:no, kod, ...rec, muhalif_sirasi: voters.indexOf('M') + 1});

      // the lead decides in the end: the decision is applied whatever the votes
      S.notes[K.hedef].push({t:K.not, adil:K.adil});
      if (K.lider) S.leadTasks.push(K.lider);
      redraw();
      slot.innerHTML = '';
      tell('Karar uygulandı', `${evet} onay${hayir ? `, ${hayir} ret` : ''}. Proje yürütücüsü kararı uyguladı.`);
      s.scrollTop = 0;
      await next(6);
    }

    s = newScene();
    s.innerHTML = `${stage(STAGE)}<h2 class="big">Toplantı bitti</h2>
      <p class="sub">Proje yürütücüsü toplantıyı kapattı. Ekibin son durumu aşağıda.</p>`;
    s.appendChild(teamTable(false).ul);
    await next(12);
  }

  /* ---------- questionnaire pieces ---------- */
  // a page of questions with one button at the bottom that unlocks once every question has an answer
  function sayfa(head, kur, cta = 'Devam'){
    return new Promise(res => {
      const s = newScene();
      s.innerHTML = head;
      const go = el('button','primary', cta); go.id = 'go'; go.disabled = true;
      const deger = kur(s, ok => { go.disabled = !ok; });
      ui.actions.appendChild(go);
      go.onclick = () => res(deger());
    });
  }
  const baslik = (adim, title, sub) => `${stage('Toplantı sonrası', adim)}<span class="tag">Bu ekranı ekibin görmüyor</span><h2 class="big">${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}`;
  // a group of buttons where exactly one stays pressed
  function tekSecim(kap, cls, opts, onPick){
    const w = el('div', cls);
    opts.forEach(([id, label]) => {
      const b = el('button', null, esc(label)); b.type = 'button'; b.setAttribute('aria-pressed','false'); b.dataset.v = id;
      b.onclick = () => { w.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); onPick(id); };
      w.appendChild(b);
    });
    kap.appendChild(w); return w;
  }
  function likert(adim, title, maddeler){
    return sayfa(baslik(adim, title, '1 = hiç katılmıyorum, 7 = tamamen katılıyorum.'), (s, ok) => {
      const v = {}; const items = el('div','items'); s.appendChild(items);
      maddeler.forEach(([id, q]) => {
        const it = el('div','item', `<span class="q">${q}</span>`); it.dataset.q = id;
        tekSecim(it, 'lk', [1,2,3,4,5,6,7].map(x => [x, String(x)]), x => { v[id] = x; ok(Object.keys(v).length === maddeler.length); });
        it.appendChild(el('div','ends', `<span>${LIKERT_UC[0]}</span><span>${LIKERT_UC[1]}</span>`));
        items.appendChild(it);
      });
      return () => v;
    });
  }
  function sayiSoru(adim, title, soru){
    return sayfa(baslik(adim, title), (s, ok) => {
      let v = null; const it = el('div','item', `<span class="q">${soru}</span>`); it.dataset.q = 'sayi';
      tekSecim(it, 'cnt', [0,1,2,3,4].map(x => [x, String(x)]), x => { v = x; ok(true); });
      s.appendChild(it);
      return () => v;
    });
  }
  function gizliOy(){
    const n = adlar(), liste = S.sira.filter(k => GIZLI.includes(k));
    return sayfa(baslik('1', 'Kimse görmeyecek olsaydı', 'Toplantının ikinci yarısındaki bu kararları yalnızca sen oylasaydın ve oyunu kimse görmeyecek olsaydı ne derdin?'), (s, ok) => {
      const v = {};
      liste.forEach(k => {
        const r = el('div','row', `<span class="q">${esc(KARAR[k].kisa(n))}</span>`); r.dataset.q = k;
        tekSecim(r, 'pair', [['onay','Onaylardım'], ['ret','Reddederdim']], x => { v[k] = x; ok(Object.keys(v).length === liste.length); });
        s.appendChild(r);
      });
      return () => v;
    });
  }
  function sorumluluk(){
    return sayfa(baslik('7', 'Sorumluluk kimdeydi?', 'Toplantıda alınan kararların sorumluluğunu 100 puan üzerinden paylaştır. Toplam 100 olmalı.'), (s, ok) => {
      const v = {lider:0, ben:0, ekip:0};
      const tot = el('div','total');
      const draw = () => { const t = v.lider + v.ben + v.ekip; tot.textContent = `Toplam: ${t} / 100`; tot.classList.toggle('ok', t === 100); ok(t === 100); };
      [['lider', `Proje yürütücüsü (Katılımcı ${S.seat.lead})`], ['ben', 'Ben'], ['ekip', 'Ekibin geri kalanı']].forEach(([id, label]) => {
        const r = el('div','step', `<span>${esc(label)}</span><button type="button" aria-label="${esc(label)} azalt">−</button><output>0</output><button type="button" aria-label="${esc(label)} artır">+</button>`);
        r.dataset.q = id;
        const [minus, plus] = r.querySelectorAll('button'), out = r.querySelector('output');
        const set = x => { v[id] = Math.max(0, Math.min(100, x)); out.textContent = v[id]; draw(); };
        minus.onclick = () => set(v[id] - 10); plus.onclick = () => set(v[id] + 10);
        s.appendChild(r);
      });
      s.appendChild(tot); draw();
      return () => ({...v});
    });
  }
  const NEDEN = [['sorun','Sorun çıkaran biri gibi görünmek istemedim'], ['iliski','Ekiple aram bozulsun istemedim'], ['etkisiz','Reddetsem de bir şey değişmezdi'],
    ['cekinme','Yürütücüden çekindim'], ['makul','Karar bana makul geldi'], ['diger','Başka bir neden']];
  function nedenler(){
    return sayfa(baslik('8', 'Neden onayladın?', 'Haksız bulunabilecek kararlardan en az birini onayladın. Bunun nedenleri nelerdi? Birden fazla seçebilirsin.'), (s, ok) => {

  function acikUclu(adim, title, soru){
    return sayfa(baslik(adim, title), (s, ok) => {
      const it = el('div','item', `<label class="q" for="acik">${soru}</label><textarea id="acik" maxlength="300"></textarea><span class="sub">İstersen boş bırakabilirsin.</span>`);

  const UC = [['evet','Evet'], ['hayir','Hayır'], ['emin_degil','Emin değilim']];
  function secim(adim, title, soru, opts){
    return sayfa(baslik(adim, title), (s, ok) => {
      let v = null; const it = el('div','item', `<span class="q">${soru}</span>`); it.dataset.q = 'secim';

  function inanc(adim){
    return sayfa(baslik(adim, 'Ekip arkadaşların', 'Kaydırıcıyı en iyi tahminine getir.'), (s, ok) => {
      let v = null;
      const it = el('div','item range', `<label class="q" for="inanc">Ekipteki diğer katılımcıların gerçek kişiler olduğuna ne kadar inandın?</label>
        <div class="rangeval unset" aria-live="polite">Kaydırıcıyı hareket ettir</div>
        <input id="inanc" type="range" min="0" max="100" step="1" value="50">
        <div class="ends"><span>0 · Hiç inanmadım</span><span>Tamamen inandım · 100</span></div>`);
      const inp = it.querySelector('input'), out = it.querySelector('.rangeval');
      const set = () => { v = Number(inp.value); out.textContent = v; out.classList.remove('unset'); ok(true); };

  async function supheHunisi(adim0){
    let a = adim0;
    const st = () => String(a++);
    if (KISA){
      const inanmak = await inanc(st());
      const duydu = await secim(st(), 'Son soru', 'Bu çalışmayı ya da benzer bir sınıf gösterimini daha önce duymuş muydun?', UC);
      return {amac:null, tuhaf:null, tuhaf_ne:null, inanc:inanmak, duydu, milgram:null};
    }
    const amac = await acikUclu(st(), 'Çalışma hakkında', 'Sence bu çalışma neyi inceliyordu?');
    const tuhaf = await secim(st(), 'Çalışma hakkında', 'Toplantıda tuhaf ya da beklenmedik bir şey oldu mu?', [['evet','Evet'], ['hayir','Hayır']]);
    const tuhafNe = tuhaf === 'evet' ? await acikUclu(String(a - 1), 'Çalışma hakkında', 'Ne oldu? Kısaca yaz.') : '';
    const inanmak = await inanc(st());
    const duydu = await secim(st(), 'Çalışma hakkında', 'Bu çalışmayı ya da benzer bir sınıf gösterimini daha önce duymuş muydun?', UC);
    const milgram = await secim(st(), 'Çalışma hakkında', 'Milgram ya da Asch deneylerini bir derste gördün mü?', UC);
    return {amac, tuhaf: tuhaf === 'evet', tuhaf_ne: tuhafNe, inanc: inanmak, duydu, milgram};
  }
  const DEMO = {

    bolum:[['muh_fen','Mühendislik ve Fen'], ['saglik','Tıp ve Sağlık'], ['sosyal','Sosyal ve Beşeri Bilimler'], ['isl_iktisat','İşletme ve İktisat'],

  /* ---------- after the meeting ---------- */
  async function anket(){
    const s = newScene('center');
    s.innerHTML = `${stage('Toplantı sonrası')}<h2 class="big">Birkaç kısa soru</h2>
      <p class="sub">Bu ekranları ekibin görmüyor. Doğru ya da yanlış cevap yok; ilk aklına geleni seç.</p>`;
    await next(8);

    if (KISA){
      R.kontrol = {ret_eden: await sayiSoru('1', 'Toplantıyı hatırla', retSoru)};
      R.suphe = await supheHunisi(2);

    }
    R.gizli = await gizliOy();

      ['adil', 'Yürütücünün kararları adildi.'],
      ['gorunur', 'Oylarımın ekipçe görüldüğünü düşündüm.'],
      ['saygili', 'Yürütücü üyelere saygılı davrandı.']])};
    const a1 = await likert('4', 'Oy verirken', [
      ['emin', 'Kararların adil olup olmadığı konusundaki yargımdan emindim.'],
      ['sosyal_bedel', 'Reddetseydim ekipte sorun çıkaran biri gibi görünürdüm.'],
      ['guvenli', 'Bu ekipte itiraz etmek güvenliydi.'],
      ['etkililik', 'Reddetmem bir şeyi değiştirirdi.']]);
    const icten = await sayiSoru('5', 'Ekip arkadaşların', 'Sence diğer 4 üyeden kaçı, kararların çoğuna içten içe karşıydı?');
    const a2 = await likert('6', 'Yürütücü ve ekip', [
      ['yetkili', 'Yürütücü bu kararları almaya yetkiliydi.'],
      ['uymak', 'Yürütücünün kararlarına uymak gerekirdi.'],
      ['lider_ozd', 'Kendimi yürütücüyle aynı tarafta hissettim.'],
      ['ekip_ozd', 'Kendimi ekibin bir parçası gibi hissettim.'],
      ['rahatsiz', 'Toplantı sırasında rahatsız oldum.']]);
    R.aracilar = {...a1, icten_karsi: icten, ...a2};
    R.sorumluluk = await sorumluluk();
    const onayladi = R.kararlar.some(k => !KARAR[k.kod].adil && (k.ilk === 'onay' || k.son === 'onay'));
    R.nedenler = onayladi ? await nedenler() : null;
    R.suphe = await supheHunisi(9);
    R.demografi = await demografi('14');
  }

  function ozetTablo(s){
    const L = {onay:'Onay', ret:'Ret', gerekce:'Gerekçe', sure:'Süre doldu'};
    const say = (kodlar, alan) => R.kararlar.filter(k => kodlar.includes(k.kod) && k[alan] === 'onay').length;
    const sat = R.kararlar.map(k => { const K = KARAR[k.kod];
      return `<tr><td>${k.sira}. ${k.kod}</td><td>${K.adil ? 'adil' : K.duzey}${S.kosul === 'tek-itirazci' && K.blok === 2 && !K.adil ? ' · itiraz' : ''}</td>
        <td>${L[k.ilk]}${k.ilk_ms != null ? ` (${k.ilk_ms} ms)` : ''}${k.ilk === 'gerekce' ? ` → ${L[k.son]}${k.yeniden_ms != null ? ` (${k.yeniden_ms} ms)` : ''}` : ''}</td></tr>`; }).join('');
    const w = el('div', null, `<span class="tag">Test sürümü · yalnızca test kayıtlarında görünür</span>
      <p class="sub">Koşul: <strong>${R.kosul === 'oybirligi' ? 'Oybirliği' : 'Tek itirazcı'}</strong> (${R.kosul_kaynagi === 'sunucu' ? 'sunucudan' : 'rastgele'}) ·
        1. blok onay ${say(['K1','K2','K4'], 'ilk')}/3 · 2. blok onay ${say(GIZLI, 'ilk')}/5 · adil onay ${say(['K3','K7'], 'ilk')}/2</p>
      <div style="overflow-x:auto"><table class="sumtable"><thead><tr><th>Sıra</th><th>Tür</th><th>İlk tepki → son oy</th></tr></thead><tbody>${sat}</tbody></table></div>
      <span class="rlabel">Kayıt (JSON)</span><pre class="json">${esc(JSON.stringify(R, null, 2))}</pre>`);
    w.style.cssText = 'display:grid; gap:12px';
    s.appendChild(w);
    buttons([{id:'again', label:'Baştan dene', cls:'primary'}]).then(() => { gen++; intro().catch(() => {}); });
  }

  /* ---------- sending the record ---------- */
  // kept on the phone until the sheet confirms it, so a lost connection or a reload does not lose it
  const PENDING = 'proje-ekibi-bekleyen-v3';
  const pending = () => { try { return JSON.parse(localStorage.getItem(PENDING) || '[]'); } catch(e){ return []; } };
  const keep = list => { try { localStorage.setItem(PENDING, JSON.stringify(list)); } catch(e){} };
  // everyone finishes within seconds of each other: wait a random moment first, then retry with growing pauses
  function send(rec, test, line, attempt = 0){
    if (attempt === 0) keep(pending().filter(p => p.r.kayit_id !== rec.kayit_id).concat({r: rec, test}));
    const say = (cls, txt) => { if (line){ line.className = 'save ' + cls; line.textContent = txt; } };
    const wait = attempt === 0 ? Math.random() * 3000 : Math.min(30000, 2000 * 2 ** attempt) * (0.5 + Math.random());
    setTimeout(() => {
      google.script.run
        .withSuccessHandler(() => { keep(pending().filter(p => p.r.kayit_id !== rec.kayit_id)); say('ok', 'Cevapların kaydedildi.'); })
        .withFailureHandler(e => {
          // a record the server rejects as invalid will never be accepted: stop instead of retrying forever
          if (/geçersiz kayıt/.test(String((e && e.message) || e))){ keep(pending().filter(p => p.r.kayit_id !== rec.kayit_id)); say('no', 'Cevaplar kaydedilemedi. Lütfen sunucuya haber ver.'); return; }
          if (attempt >= 1) say('no', 'Bağlantı yavaş, tekrar deneniyor. Sayfayı kapatma.');
          send(rec, test, line, attempt + 1);
        })
        .kaydet(rec, test);
    }, wait);
  }

  // Apps Script serves the page inside a frame, so the address is read through google.script.url
  function start(){
    if (!SERVER){ KISA = location.hash === '#kisa'; return intro(); }
    let begun = false;
    const go = () => { if (begun) return; begun = true; intro(); pending().forEach(p => send(p.r, p.test, null)); };
    try { google.script.url.getLocation(l => { const p = (l && l.parameter) || {}; TEST = p.test === '1'; KISA = p.kisa === '1'; go(); }); } catch(e){}
    setTimeout(go, 2000);
  }
  start();
})();
</script>
